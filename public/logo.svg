<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" fill="none">
  <defs>
    <!-- Gradient for Infinity Ribbon & 'D' -->
    <linearGradient id="dGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066FF" />
      <stop offset="50%" stop-color="#0099FF" />
      <stop offset="100%" stop-color="#00D2FF" />
    </linearGradient>
    <linearGradient id="ribbonDark" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#003399" />
      <stop offset="60%" stop-color="#0055D4" />
      <stop offset="100%" stop-color="#0088FF" />
    </linearGradient>
    <linearGradient id="tnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0066FF" />
      <stop offset="100%" stop-color="#00D2FF" />
    </linearGradient>
    <linearGradient id="lineGradL" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#0066FF" />
    </linearGradient>
    <linearGradient id="lineGradR" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0066FF" />
      <stop offset="100%" stop-color="#00D2FF" />
    </linearGradient>
  </defs>

  <!-- EMBLEM GROUP -->
  <g transform="translate(15, 10)">
    <!-- Digital Blocks / Pixels on Left -->
    <rect x="26" y="44" width="14" height="14" rx="2" fill="#0088FF" />
    <rect x="8" y="64" width="14" height="14" rx="2" fill="#00A2FF" />
    <rect x="24" y="84" width="10" height="10" rx="1.5" fill="#00B8FF" />
    <rect x="22" y="102" width="13" height="13" rx="2" fill="#0099FF" />

    <!-- Outer 'D' Frame & Shadow -->
    <path d="M 45 35 L 105 35 C 145 35 168 62 168 98 C 168 134 142 162 105 162 L 45 162 Z" fill="#0A2540" />
    <path d="M 52 42 L 102 42 C 138 42 158 65 158 98 C 158 130 135 155 102 155 L 52 155 Z" fill="#0D3B66" />
    
    <!-- Ribbon Top Arch -->
    <path d="M 45 35 L 110 35 C 142 35 165 58 165 92 C 165 102 160 112 152 120 C 140 102 125 90 102 90 C 72 90 52 110 45 140 Z" fill="url(#ribbonDark)" />
    
    <!-- 3D Ribbon Infinity Loop (Cyan / Blue Gradient) -->
    <path d="M 45 110 C 58 85 82 82 105 82 C 132 82 156 100 156 122 C 156 148 132 162 105 162 C 80 162 60 148 50 132 C 65 132 82 122 92 108 C 102 95 118 92 130 102 C 138 110 138 122 130 130 C 122 138 108 142 95 135 C 75 125 60 115 45 110 Z" fill="url(#dGrad)" />

    <!-- Foreground Infinity Wave Crossing -->
    <path d="M 45 110 C 60 115 78 125 95 140 C 112 155 132 152 145 138 C 138 152 122 162 100 162 C 72 162 55 142 45 110 Z" fill="#0055D4" />
    <path d="M 45 110 C 52 100 68 92 88 92 C 115 92 138 108 146 125 C 135 108 115 98 92 98 C 72 98 56 104 45 110 Z" fill="#00D2FF" />

    <!-- White Cloud Icon in Base of D -->
    <g transform="translate(60, 126) scale(0.9)">
      <path d="M 12 18 L 36 18 C 40.5 18 44 14.5 44 10 C 44 6 41 2.8 37.2 2.1 C 36 0.8 34.2 0 32.2 0 C 29.5 0 27.2 1.5 26.2 3.8 C 25.2 2.8 23.8 2.2 22.2 2.2 C 19.2 2.2 16.8 4.2 16.2 7 C 15.5 6.8 14.8 6.6 14 6.6 C 9.6 6.6 6 10.2 6 14.6 C 6 15.2 6.1 15.8 6.2 16.4 C 4 16.8 2.5 18.6 2.5 20.8" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>

  <!-- WORDMARK: DEVOPS (Navy/Dark in light mode, dynamic in component) -->
  <text x="185" y="118" font-family="'Inter', 'Montserrat', -apple-system, sans-serif" font-weight="900" font-size="62" letter-spacing="0.5" fill="#0B1A30">
    DEV<tspan letter-spacing="-2">O</tspan>PS
  </text>
  
  <!-- WORDMARK: TN (Cyan/Blue Gradient) -->
  <text x="442" y="118" font-family="'Inter', 'Montserrat', -apple-system, sans-serif" font-weight="900" font-size="62" letter-spacing="1" fill="url(#tnGrad)">
    TN
  </text>

  <!-- SUBTITLE / TAGLINE -->
  <line x1="190" y1="148" x2="225" y2="148" stroke="url(#lineGradL)" stroke-width="2.5" stroke-linecap="round" />
  <text x="345" y="153" font-family="'Inter', -apple-system, sans-serif" font-weight="600" font-size="18.5" letter-spacing="3.5" fill="#2D3748" text-anchor="middle">
    Build. Deploy. Scale.
  </text>
  <line x1="465" y1="148" x2="500" y2="148" stroke="url(#lineGradR)" stroke-width="2.5" stroke-linecap="round" />
</svg>
